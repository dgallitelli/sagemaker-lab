name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --quiet ruff==0.8.4

      - name: AST parse every Python file
        run: |
          set -e
          mapfile -t pyfiles < <(git ls-files '*.py')
          echo "Parsing ${#pyfiles[@]} Python files..."
          for f in "${pyfiles[@]}"; do
            python -c "import ast, pathlib; ast.parse(pathlib.Path('$f').read_text())" \
              || { echo "::error file=$f::Failed to parse"; exit 1; }
          done

      - name: Ruff lint
        run: ruff check .
