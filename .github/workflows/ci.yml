name: repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python, notebooks, and relative links
        run: python scripts/check_repo_structure.py

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
