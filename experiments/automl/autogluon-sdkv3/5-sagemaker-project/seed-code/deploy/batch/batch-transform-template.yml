Description: >
  Batch transform for the AutoML model package: a SageMaker Model, a Lambda
  that runs+waits-on a TransformJob, and an EventBridge schedule (disabled in
  staging — invoked directly by the Test stage instead; enabled in prod).
Parameters:
  SageMakerProjectName:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: ^[a-zA-Z](-*[a-zA-Z0-9])*
  ModelExecutionRoleArn:
    Type: String
  ModelPackageName:
    Type: String
  StageName:
    Type: String
  TransformInstanceType:
    Type: String
  TransformInstanceCount:
    Type: Number
    MinValue: 1
  ScheduleExpression:
    Type: String
  ScheduleEnabled:
    Type: String
    AllowedValues: ["true", "false"]
  DataCaptureUploadPath:
    Type: String
    Description: Used as the base for batch input/output S3 prefixes.
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket holding the run_transform.py Lambda deployment zip.
  LambdaCodeS3Key:
    Type: String
    Description: S3 key of the run_transform.py Lambda deployment zip.
  LambdaResourceNamePrefix:
    Type: String
    Description: >
      Length-safe, unique prefix for the Lambda/IAM-role/EventBridge-rule
      names below, computed once per deploy (via sagemaker.core.utils.name_from_base)
      to stay under IAM's 64-char RoleName and EventBridge's 64-char Rule
      Name limits regardless of SageMakerProjectName length. This value
      includes a timestamp and changes on every deploy, so CloudFormation
      replaces (rather than updates in place) the IAM role, Lambda function,
      and EventBridge rule on each pipeline run — accepted tradeoff for
      guaranteed length-safety.

Conditions:
  IsScheduleEnabled: !Equals [!Ref ScheduleEnabled, "true"]

Resources:
  Model:
    Type: AWS::SageMaker::Model
    Properties:
      Containers:
        - ModelPackageName: !Ref ModelPackageName
      ExecutionRoleArn: !Ref ModelExecutionRoleArn

  RunTransformLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub sagemaker-${LambdaResourceNamePrefix}-batch-transform-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunTransformPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [sagemaker:CreateTransformJob, sagemaker:DescribeTransformJob]
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"

  RunTransformLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub sagemaker-${LambdaResourceNamePrefix}-run-transform
      Runtime: python3.12
      Handler: run_transform.handler
      Role: !GetAtt RunTransformLambdaRole.Arn
      Timeout: 900
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          MODEL_NAME: !GetAtt Model.ModelName

  ScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub sagemaker-${LambdaResourceNamePrefix}-batch-schedule
      ScheduleExpression: !Ref ScheduleExpression
      State: !If [IsScheduleEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt RunTransformLambda.Arn
          Id: !Sub "${SageMakerProjectName}-${StageName}-target"
          Input: !Sub |
            {
              "model_name": "${Model.ModelName}",
              "transform_job_name": "${SageMakerProjectName}-${StageName}-scheduled",
              "input_s3_uri": "${DataCaptureUploadPath}/batch-input/",
              "output_s3_uri": "${DataCaptureUploadPath}/batch-output/",
              "instance_type": "${TransformInstanceType}",
              "instance_count": ${TransformInstanceCount},
              "content_type": "text/csv"
            }

  ScheduleInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RunTransformLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduleRule.Arn
